<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📘 Lecteur de livres - Tadaksahak Learning</title>
  
  <!-- Héritage du style principal -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Styles spécifiques au viewer -->
  <style>
    .back-to-app {
      position: sticky;
      top: 0;
      background: var(--bg-light);
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    
    .back-to-app a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    
    .back-to-app a:hover {
      text-decoration: underline;
    }
    
    .book-viewer {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .book-header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 2px solid var(--accent);
    }
    
    .book-author {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    
    .book-title {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .book-subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 1rem;
    }
    
    .book-meta {
      font-size: 0.85rem;
      opacity: 0.7;
    }
    
    .book-description {
      font-style: italic;
      margin: 2rem 0;
      padding: 1.5rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--accent);
    }
    
    .chapter {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    
    .chapter-number {
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    
    .chapter-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    
    .chapter-subtitle {
      font-size: 1rem;
      opacity: 0.7;
      margin-bottom: 1.5rem;
    }
    
    .chapter-content p {
      margin-bottom: 1.2rem;
      line-height: 1.7;
    }
    
    .footnotes {
      margin-top: 1.5rem;
      padding-top: 1rem;
      font-size: 0.85rem;
      border-top: 1px dashed var(--border);
      color: var(--text-muted);
    }
    
    .footnote {
      margin-bottom: 0.3rem;
    }
    
    .conclusion {
      margin: 2rem 0;
      padding: 1.5rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--success);
    }
    
    .conclusion-title {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: var(--success);
    }
    
    .bibliography {
      margin: 2rem 0;
      padding: 1.5rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
    }
    
    .bibliography h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }
    
    .bibliography ul {
      list-style: none;
      padding-left: 0;
    }
    
    .bibliography li {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    
    .book-footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      opacity: 0.6;
    }
    
    .floating-nav {
      position: fixed;
      bottom: 100px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    
    .nav-chapter {
      background: var(--primary);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      color: white;
      transition: all var(--transition);
      box-shadow: var(--shadow-md);
    }
    
    .nav-chapter:hover {
      background: var(--hover);
      transform: scale(1.05);
    }
    
    .theme-selector {
      position: fixed;
      bottom: 100px;
      left: 20px;
      z-index: 1000;
    }
    
    .theme-selector select {
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-light);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 500;
    }
    
    .back-to-top {
      position: fixed;
      bottom: 160px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--transition);
      z-index: 1000;
      color: white;
      font-size: 1.2rem;
    }
    
    .back-to-top.visible {
      opacity: 1;
    }
    
    .book-loading, .error-message {
      text-align: center;
      padding: 3rem;
      font-size: 1.2rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .book-viewer { padding: 1rem; }
      .book-title { font-size: 2rem; }
      .floating-nav { bottom: 80px; }
      .theme-selector { bottom: 80px; }
      .back-to-top { bottom: 140px; }
    }
  </style>
</head>
<body class="dark">

<div class="back-to-app">
  <a href="index.html">🏠 Retour à l'application principale</a>
</div>

<div class="book-viewer" id="bookViewer">
  <div class="book-loading">📖 Chargement du livre...</div>
</div>

<div class="floating-nav">
  <button id="prevChapter" class="nav-chapter" title="Chapitre précédent">◀</button>
  <button id="nextChapter" class="nav-chapter" title="Chapitre suivant">▶</button>
</div>

<div class="theme-selector">
  <select id="themeSelect">
    <option value="dark">🌙 Sombre</option>
    <option value="light">📖 Clair</option>
    <option value="sepia">📜 Sepia</option>
  </select>
</div>

<button id="backToTop" class="back-to-top" title="Haut de page">⬆</button>

<script>
  // Gestion du thème avec les CLASSES (comme dans style.css)
  const select = document.getElementById('themeSelect');
  const body = document.body;
  
  // Récupérer le thème sauvegardé
  const savedTheme = localStorage.getItem('livre-theme') || 'dark';
  body.className = savedTheme;
  if (select) select.value = savedTheme;
  
  // Sauvegarder et appliquer le thème
  select.onchange = (e) => {
    const newTheme = e.target.value;
    body.className = newTheme;
    localStorage.setItem('livre-theme', newTheme);
  };

  // Récupérer l'ID du livre dans l'URL
  const urlParams = new URLSearchParams(window.location.search);
  const livreId = parseInt(urlParams.get('id')) || 1;

  let currentChapter = 0;
  let livreData = null;

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function afficherLivre() {
    if (!livreData) return;

    const container = document.getElementById('bookViewer');
    if (!container) return;

    let html = `
      <div class="book-header">
        <div class="book-author">${escapeHtml(livreData.auteur.toUpperCase())}</div>
        <h1 class="book-title">${escapeHtml(livreData.titre)}</h1>
        <div class="book-subtitle">${escapeHtml(livreData.sous_titre || '')}</div>
        <div class="book-meta">📅 ${livreData.annee || ''} • 📄 ${livreData.pages || '?'} pages • 🏷️ ${escapeHtml(livreData.categorie || '')}</div>
      </div>
      <div class="book-content">
        <div class="book-description">${escapeHtml(livreData.description || '')}</div>
        <div class="chapters-container" id="chaptersContainer"></div>
    `;

    if (livreData.conclusion) {
      html += `<div class="conclusion-section" id="conclusionSection"></div>`;
    }

    if (livreData.bibliographie && livreData.bibliographie.length) {
      html += `<div class="bibliography-section" id="bibliographySection"></div>`;
    }

    html += `
      </div>
      <div class="book-footer">
        <p>© ${livreData.annee || ''} ${escapeHtml(livreData.auteur)}</p>
        <p>📚 Tadaksahak Learning — Bibliothèque numérique</p>
      </div>
    `;

    container.innerHTML = html;

    // Ajouter les chapitres
    const chaptersContainer = document.getElementById('chaptersContainer');
    if (chaptersContainer && livreData.chapitres && livreData.chapitres.length) {
      livreData.chapitres.forEach((chap, idx) => {
        const chapDiv = document.createElement('div');
        chapDiv.className = 'chapter';
        chapDiv.id = `chapter-${idx}`;
        
        let chapHtml = `
          <div class="chapter-number">CHAPITRE ${chap.numero}</div>
          <h2 class="chapter-title">${escapeHtml(chap.titre)}</h2>
        `;
        
        if (chap.sous_titre) {
          chapHtml += `<div class="chapter-subtitle">${escapeHtml(chap.sous_titre)}</div>`;
        }
        
        chapHtml += `<div class="chapter-content">`;
        
        if (chap.contenu && chap.contenu.length) {
          chap.contenu.forEach(paragraphe => {
            chapHtml += `<p>${escapeHtml(paragraphe).replace(/\n/g, '<br>')}</p>`;
          });
        }
        
        if (chap.notes && chap.notes.length) {
          chapHtml += `<div class="footnotes">`;
          chap.notes.forEach(note => {
            chapHtml += `<div class="footnote">${escapeHtml(note)}</div>`;
          });
          chapHtml += `</div>`;
        }
        
        chapHtml += `</div>`;
        chapDiv.innerHTML = chapHtml;
        chaptersContainer.appendChild(chapDiv);
      });
    }

    // Ajouter la conclusion
    if (livreData.conclusion) {
      const conclusionDiv = document.getElementById('conclusionSection');
      if (conclusionDiv) {
        let conclusionHtml = `
          <div class="conclusion">
            <h2 class="conclusion-title">${escapeHtml(livreData.conclusion.titre || 'Conclusion')}</h2>
        `;
        if (livreData.conclusion.contenu && livreData.conclusion.contenu.length) {
          livreData.conclusion.contenu.forEach(paragraphe => {
            conclusionHtml += `<p>${escapeHtml(paragraphe)}</p>`;
          });
        }
        conclusionHtml += `</div>`;
        conclusionDiv.innerHTML = conclusionHtml;
      }
    }

    // Ajouter la bibliographie
    if (livreData.bibliographie && livreData.bibliographie.length) {
      const biblioDiv = document.getElementById('bibliographySection');
      if (biblioDiv) {
        let biblioHtml = `
          <div class="bibliography">
            <h2>📚 Références bibliographiques</h2>
            <ul>
        `;
        livreData.bibliographie.forEach(ref => {
          biblioHtml += `<li>${escapeHtml(ref)}</li>`;
        });
        biblioHtml += `
            </ul>
          </div>
        `;
        biblioDiv.innerHTML = biblioHtml;
      }
    }
  }

  function chargerLivre() {
    fetch('data/livres.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(livres => {
        if (livres && livres.length) {
          livreData = livres.find(l => l.id === livreId) || livres[0];
          if (livreData) {
            afficherLivre();
            document.title = `📘 ${livreData.titre} - Tadaksahak Learning`;
          } else {
            document.getElementById('bookViewer').innerHTML = '<div class="error-message">📚 Livre non trouvé</div>';
          }
        } else {
          document.getElementById('bookViewer').innerHTML = '<div class="error-message">📚 Aucun livre disponible</div>';
        }
      })
      .catch(error => {
        console.error('Erreur:', error);
        document.getElementById('bookViewer').innerHTML = '<div class="error-message">❌ Erreur de chargement du livre. Vérifiez que le fichier data/livres.json existe.</div>';
      });
  }

  function scrollToChapter(index) {
    const chapters = document.querySelectorAll('.chapter');
    if (chapters && chapters[index]) {
      chapters[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
      currentChapter = index;
    }
  }

  document.getElementById('prevChapter')?.addEventListener('click', () => scrollToChapter(currentChapter - 1));
  document.getElementById('nextChapter')?.addEventListener('click', () => scrollToChapter(currentChapter + 1));

  const backBtn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    if (backBtn) {
      backBtn.classList.toggle('visible', window.scrollY > 300);
    }
  });
  backBtn?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  chargerLivre();
</script>

</body>
</html>
