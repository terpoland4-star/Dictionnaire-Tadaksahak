# Site : https://dictionnaire.hamadine-services.net
# Copie versionnée de /etc/nginx/sites-available/dictionnaire.hamadine-services.net
# Installation et retour arrière : voir deploy/nginx/README.md

server {
    server_name dictionnaire.hamadine-services.net;

    # Compression : nginx ne compresse que le HTML par défaut. mots.json (88 Ko),
    # style.css (72 Ko) et les modules JS sont du texte qui se réduit de 70 à 80 %.
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml;

    # API : helmet ajoute déjà ses en-têtes de sécurité, on n'en remet pas ici.
    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /srv/tadaksahak/apps/web;
        try_files $uri $uri/ =404;

        # Les locations imbriquées n'ont pas de add_header : elles héritent de ceux-ci
        # (en ajouter un dans une location supprimerait tous les autres).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Les fichiers ne portent pas de numéro de version dans leur nom : HTML, JS, CSS,
        # JSON et surtout sw.js sont revalidés à chaque visite (réponse 304 grâce à l'ETag,
        # donc quasi gratuite). Le service worker garde de toute façon sa copie hors-ligne.
        location ~* \.(?:html|js|css|json|webmanifest)$ {
            expires -1;
        }

        # mime.types de Debian ne connaît pas .webmanifest (servi en text/plain sinon).
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            expires -1;
        }

        # Images, polices et livres changent rarement.
        location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|pdf)$ {
            expires 7d;
        }
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/dictionnaire.hamadine-services.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dictionnaire.hamadine-services.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dictionnaire.hamadine-services.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name dictionnaire.hamadine-services.net;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
